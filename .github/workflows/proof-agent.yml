name: Proof Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  verify:
    name: Proof Agent review (advisory)
    runs-on: ubuntu-latest
    env:
      # Use Haiku 5.5 to reduce review latency; the SDK's default 60-second
      # wait still applies, and model response times can vary.
      PROOF_AGENT_COPILOT_MODEL: claude-haiku-5.5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git diff

      - name: Run Proof Agent verification
        uses: AndreaGriffiths11/proof-agent@184e2373a89c62745d91a4e7cda7d1dd5c324bf7  # v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/main
          # AI findings are advisory. The acceptance tests are the required
          # check, and a person decides whether to merge.
          block-on-fail: false
          post-comment: true
          comment-mode: collapse
